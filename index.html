<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savvas Paragkamian</title>
  <meta name="description" content="Computational biologist — microbiomes, networks, biodiversity">
  <meta name="author" content="Savvas Paragkamian">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F7F4EE;
      --ink:     #1A1A18;
      --ink-mid: #555550;
      --ink-dim: #888880;
      --amber:   #F7BC00;
    }

    html { font-size: 18px; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
    }

    /* ── Navigation ─────────────────────────────── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 3rem;
    }

    .nav-brand {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mid);
      text-decoration: none;
    }

    .nav-links a:hover { color: var(--ink); }

    .lang-switch {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.10em;
      color: var(--ink-dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .lang-switch:hover { border-bottom-color: var(--ink-dim); }

    /* ── Hero ───────────────────────────────────── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem 6rem;
      text-align: center;
    }

    .hero-logo {
      width: min(420px, 82vw);
      height: auto;
      display: block;
      /* subtle entrance feel — no JS needed */
      opacity: 1;
    }

    .hero-name {
      margin-top: 2.8rem;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: normal;
      letter-spacing: 0.01em;
      line-height: 1.2;
      color: var(--ink);
    }

    .hero-tagline {
      margin-top: 0.9rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      color: var(--ink-mid);
      line-height: 1.7;
    }

    .hero-links {
      margin-top: 2.2rem;
      display: flex;
      gap: 2rem;
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-links a {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.80rem;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--ink-mid);
      text-decoration: none;
      border-bottom: 1px solid var(--ink-dim);
      padding-bottom: 1px;
    }

    .hero-links a:hover { color: var(--ink); border-bottom-color: var(--ink); }

    /* ── Section divider ────────────────────────── */
    hr {
      border: none;
      border-top: 1px solid #DDDAD3;
      margin: 0 3rem;
    }

    /* ── Footer ─────────────────────────────────── */
    footer {
      padding: 2.4rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-copy {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
    }

    .footer-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }

    .footer-links a {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink-dim);
      text-decoration: none;
    }
    .footer-links a:hover { color: var(--ink-mid); }

    /* ── Responsive ─────────────────────────────── */
    @media (max-width: 600px) {
      nav { padding: 1.4rem 1.4rem; }
      .nav-links { gap: 1.4rem; }
      .hero { padding: 2rem 1.4rem 4rem; }
      hr { margin: 0 1.4rem; }
      footer { padding: 1.8rem 1.4rem; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">Unonoctium</a>
  <ul class="nav-links">
    <li><a href="/research">Research</a></li>
    <li><a href="/publications">Publications</a></li>
    <li><a href="/notes">Notes</a></li>
    <li><a href="/cv.pdf">CV</a></li>
  </ul>
  <a class="lang-switch" href="/el/">EL</a>
</nav>

<main class="hero">
  <img class="hero-logo" src="logo.svg" alt="Unonoctium — balloon with network" width="700" height="820">

  <h1 class="hero-name">Savvas Paragkamian</h1>

  <p class="hero-tagline">
    Computational biologist · Microbiomes · Networks · Biodiversity<br>
    University of Crete &amp; HCMR
  </p>

  <ul class="hero-links">
    <li><a href="https://github.com/savvas-paragkamian">GitHub</a></li>
    <li><a href="https://orcid.org/">ORCID</a></li>
    <li><a href="https://scholar.google.com/">Scholar</a></li>
    <li><a href="mailto:s.paragamian@gmail.com">Email</a></li>
  </ul>
</main>

<hr>

<footer>
  <span class="footer-copy">© Savvas Paragkamian — CC0</span>
  <ul class="footer-links">
    <li><a href="https://unonoctium.blogspot.com">Old blog</a></li>
    <li><a href="https://github.com/savvas-paragkamian/unonoctium_website">Source</a></li>
  </ul>
</footer>

</body>
</html>
