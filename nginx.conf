server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Content-Security-Policy
        "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
        always;

    gzip_static on;

    # Cache static assets aggressively (fingerprinted by Hugo)
    location ~* \.(svg|png|jpg|webp|woff2|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # EN at root, EL at /el/ — try file, then directory index, then 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
