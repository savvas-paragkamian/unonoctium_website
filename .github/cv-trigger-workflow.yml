# Copy this file to Curriculum_Vitae/.github/workflows/trigger-website.yml
name: Trigger website deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'publications.bib'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: savvas-paragkamian/unonoctium_website
          event-type: cv_updated
